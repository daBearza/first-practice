name: Test and Deploy v2
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Setup Dependancies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Run Test
        run: npm run test
      - name: Run Build
        run: npm run build
      - name: Deploy Build
        run: echo "Deploy build"
